# VITA EYE production stack.
#   1. cp .env.example .env  and fill in every secret (cd backend && npm run keys:generate)
#   2. put TLS certificates in infra/nginx/certs/ (fullchain.pem, privkey.pem)
#   3. docker compose up -d --build
# Only Nginx publishes ports. MySQL, Redis, the backend, the AI service and the Next.js server are
# reachable solely on the private `internal` network (no internet access, no host ports).

name: vita-eye

x-restart: &restart
  restart: unless-stopped

x-backend-env: &backend-env
  NODE_ENV: production
  BACKEND_HOST: 0.0.0.0
  BACKEND_PORT: "5000"
  DB_HOST: mysql
  DB_PORT: "3306"
  # Registering an organization creates its dedicated database and grants DB_USER access to it
  DB_ADMIN_USER: root
  DB_ADMIN_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379
  AI_SERVICE_URL: http://ai:8000
  EVIDENCE_STORAGE_DIR: /data/evidence
  TRUST_PROXY: "true"
  COOKIE_SECURE: "true"
  # Camera URLs may never point back into the stack (internal/egress subnets), loopback or link-local
  CAMERA_BLOCKED_NETWORKS: 172.30.10.0/24,172.30.11.0/24,172.30.12.0/24,127.0.0.0/8,169.254.0.0/16,::1/128,fe80::/10

services:
  mysql:
    <<: *restart
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_DATABASE: ${DB_NAME:-vita_eye_db}
      MYSQL_USER: ${DB_USER:?set DB_USER in .env (not root)}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    <<: *restart
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    # BullMQ requires noeviction; AOF keeps queued notification jobs across restarts
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes --maxmemory-policy noeviction"]
    volumes:
      - redis-data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: vita-eye/backend:latest
    build: &backend-build
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    env_file: .env
    environment: *backend-env
    command: ["sh", "-c", "node dist/db/cli.js migrate && node dist/db/cli.js seed"]
    restart: "no"
    networks: [internal]
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    <<: *restart
    image: vita-eye/backend:latest
    build: *backend-build
    env_file: .env
    environment: *backend-env
    volumes:
      - evidence-data:/data/evidence
      # Optional: Firebase service-account JSON, then set
      # FIREBASE_SERVICE_ACCOUNT_PATH=/run/secrets/vita/firebase-service-account.json in .env
      - ./secrets:/run/secrets/vita:ro
    networks: [internal, egress]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  ai:
    <<: *restart
    image: vita-eye/ai-service:latest
    build:
      context: .
      dockerfile: infra/docker/ai-service.Dockerfile
    env_file: .env
    environment:
      AI_HOST: 0.0.0.0
      AI_PORT: "8000"
      AI_MODELS_DIR: ./models
      BACKEND_INTERNAL_URL: http://backend:5000
    # `egress` lets the AI service reach RTSP/MJPEG cameras on the site LAN
    networks: [internal, egress]

  frontend:
    <<: *restart
    image: vita-eye/frontend:latest
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        API_PROXY_TARGET: http://backend:5000
        NEXT_PUBLIC_SOCKET_URL: ""
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
        NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${NEXT_PUBLIC_FIREBASE_VAPID_KEY:-}
    networks: [internal]

  nginx:
    <<: *restart
    image: nginx:1.30-alpine
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/nginx/templates:/etc/nginx/templates:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    networks: [internal, edge]
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

networks:
  internal:
    internal: true
    ipam:
      config:
        - subnet: 172.30.10.0/24
  egress:
    ipam:
      config:
        - subnet: 172.30.11.0/24
  edge:
    ipam:
      config:
        - subnet: 172.30.12.0/24

volumes:
  mysql-data:
  redis-data:
  evidence-data:
