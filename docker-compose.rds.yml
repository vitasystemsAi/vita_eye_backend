# Use Amazon RDS instead of the bundled MySQL container.
x-rds-env: &rds-env
  DB_HOST: ${DB_HOST:?set DB_HOST in .env}
  DB_ADMIN_USER: ${DB_ADMIN_USER:?set DB_ADMIN_USER in .env}
  DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:?set DB_ADMIN_PASSWORD in .env}
  DB_SSL: "true"
  NODE_EXTRA_CA_CERTS: /run/secrets/vita/rds-global-bundle.pem

services:
  mysql:
    profiles: ["bundled-mysql"]

  migrate:
    environment: *rds-env
    volumes:
      - ./secrets:/run/secrets/vita:ro
      - ./backend/umzug.json:/app/backend/umzug.json:ro
    networks: [internal, egress]
    depends_on: !reset null

  backend:
    environment: *rds-env
    depends_on: !override
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
